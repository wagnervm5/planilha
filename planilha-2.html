<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel de Produção</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #111; color: white; margin: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 2em; } /* Fonte grande para fábrica */
        th, td { border: 1px solid #444; padding: 15px; text-align: left; }
        th { background: #333; }
        tr:nth-child(even) { background: #222; }
    </style>
</head>
<body>
    <h1>STATUS DA PRODUÇÃO</h1>
    <div id="tabela-container">Carregando dados...</div>

    <script>
        const linkCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTskZL4VMWOygXyQbhVQc7QaVaZEPZf7dh5edqA8yV3C4O71n-t48mGH3wSMJIPvlaKjWzjNhimAaf4/pub?gid=0&single=true&output=csv";

        function atualizarPainel() {
            Papa.parse(linkCSV, {
                download: true,
                header: true,
                complete: function(results) {
                    gerarTabela(results.data);
                }
            });
        }

        function gerarTabela(dados) {
            let html = '<table><thead><tr>';
            // Criar cabeçalhos
            Object.keys(dados[0]).forEach(key => html += `<th>${key}</th>`);
            html += '</tr></thead><tbody>';
            
            // Criar linhas
            dados.forEach(linha => {
                html += '<tr>';
                Object.values(linha).forEach(valor => html += `<td>${valor}</td>`);
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            document.getElementById('tabela-container').innerHTML = html;
        }

        // Atualiza ao abrir e depois a cada 30 segundos (30000ms)
        atualizarPainel();
        setInterval(atualizarPainel, 30000);
    </script>
</body>
</html>
